<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분수 연산 마스터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background: #f1f5f9; color: #334155; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
        .card { background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 480px; padding: 2rem; text-align: center; position: relative; overflow: hidden; }
        h1 { font-size: 1.5rem; color: #1e3a8a; margin-bottom: 1.5rem; }
        .hidden { display: none !important; }

        /* 입력창 & 버튼 공통 */
        input[type="text"], input[type="number"] { width: 100%; padding: 0.75rem; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; text-align: center; margin-bottom: 1rem; outline: none; }
        input:focus { border-color: #2563eb; }
        button { width: 100%; padding: 0.85rem; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }

        /* 모드 선택 버튼들 */
        .mode-grid { display: grid; gap: 0.75rem; margin-top: 1rem; }
        .mode-btn { background: #f8fafc; color: #1e293b; border: 2px solid #e2e8f0; text-align: left; padding: 1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .mode-btn:hover { border-color: #2563eb; background: #eff6ff; }

        /* 게임 상단 정보 */
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.95rem; font-weight: 600; background: #f8fafc; padding: 0.75rem 1rem; border-radius: 8px; }
        .lives { color: #ef4444; letter-spacing: 2px; }

        /* 타이머 바 */
        .timer-container { width: 100%; background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 1.5rem; }
        .timer-bar { height: 100%; background: #2563eb; width: 100%; transition: width 0.1s linear, background-color 0.3s; }

        /* 분수 수식 표기 */
        .equation-box { display: flex; justify-content: center; align-items: center; gap: 1rem; font-size: 1.8rem; font-weight: bold; margin: 1.5rem 0; min-height: 80px; }
        .fraction { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; }
        .fraction .num { border-bottom: 3px solid #334155; padding: 0 4px; }
        .fraction .den { padding: 0 4px; }

        /* 답 입력 칸 (분자/분모) */
        .answer-box { display: flex; flex-direction: column; align-items: center; width: 100px; margin: 0 auto 1.5rem; }
        .answer-box input { margin-bottom: 0; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .answer-line { width: 100%; height: 3px; background: #334155; margin: 4px 0; }

        /* 경고 메시지 */
        .alert-msg { color: #ef4444; font-size: 0.85rem; font-weight: bold; min-height: 1.2rem; margin-bottom: 0.5rem; }

        /* 모달 팝업 (해설 및 정답) */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 2rem; z-index: 10; backdrop-filter: blur(4px); }
        .modal h2 { color: #f87171; margin-bottom: 0.5rem; font-size: 1.5rem; }
        .modal p { margin-bottom: 1rem; font-size: 1.1rem; }
        .modal button { background: #10b981; max-width: 200px; }
        .modal button:hover { background: #059669; }
        
        .home-link { display: inline-block; margin-top: 1rem; color: #64748b; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="card">
        <!-- 1. 학번 입력 화면 -->
        <div id="screen-auth">
            <h1>🧪 분수 연산 마스터</h1>
            <p style="margin-bottom: 1.5rem; color: #64748b;">학번 4자리를 입력하고 입장하세요.</p>
            <input type="text" id="student-id" placeholder="예: 1101" maxlength="4">
            <div id="auth-alert" class="alert-msg"></div>
            <button onclick="checkAuth()">입장하기</button>
            <a href="index.html" class="home-link">← 메인 화면으로 돌아가기</a>
        </div>

        <!-- 2. 모드 선택 화면 -->
        <div id="screen-mode" class="hidden">
            <h1 id="welcome-msg">환영합니다!</h1>
            <p style="color: #64748b;">도전할 연산 모드를 선택하세요.</p>
            <div class="mode-grid">
                <button class="mode-btn" onclick="startGame('덧셈')">➕ 분수의 덧셈 <span>→</span></button>
                <button class="mode-btn" onclick="startGame('뺄셈')">➖ 분수의 뺄셈 <span>→</span></button>
                <button class="mode-btn" onclick="startGame('곱셈')">✖️ 분수의 곱셈 <span>→</span></button>
                <button class="mode-btn" onclick="startGame('나눗셈')">➗ 분수의 나눗셈 <span>→</span></button>
                <button class="mode-btn" onclick="startGame('랜덤')">🎲 랜덤 혼합 <span>→</span></button>
            </div>
        </div>

        <!-- 3. 메인 게임 화면 -->
        <div id="screen-game" class="hidden">
            <div class="game-header">
                <span id="user-info">1101 홍길동</span>
                <span id="stage-info" style="color:#2563eb;">1단계 (1/3)</span>
                <span id="lives-display" class="lives">❤️❤️❤️</span>
            </div>

            <div class="timer-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>

            <div class="equation-box" id="equation-display"></div>

            <div class="answer-box">
                <input type="number" id="ans-num" placeholder="분자">
                <div class="answer-line"></div>
                <input type="number" id="ans-den" placeholder="분모">
            </div>

            <div id="game-alert" class="alert-msg"></div>
            <button onclick="submitAnswer()">정답 제출</button>
        </div>

        <!-- 4. 해설 모달 (틀렸거나 정수/약분 오류 시) -->
        <div id="modal-explain" class="modal hidden">
            <h2 id="modal-title">아쉬워요!</h2>
            <p id="modal-msg">정답은 다음과 같습니다.</p>
            <div id="modal-answer-box" class="equation-box" style="margin: 1rem 0;"></div>
            <button onclick="closeModal()">확인했어요</button>
        </div>

        <!-- 5. 엔딩 화면 (10단계 클리어) -->
        <div id="screen-ending" class="hidden">
            <h1 style="font-size: 2rem; color: #10b981; margin-bottom: 1rem;">🎉 축하합니다!</h1>
            <p id="ending-msg" style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 2rem;"></p>
            <button onclick="location.reload()">처음으로 돌아가기</button>
        </div>
    </div>

    <script>
        // 사전 등록 학번 명단 (필요 시 수정 및 추가)
        const studentList = {
            "1101": "강민경", "1102": "김서진", "1103": "문지호", "1104": "박은성", "1105": "윤희진", "1106": "이나리", "1107": "이지연", "1108": "이지영", "1109": "조예은", "1110": "조윤아", "1111": "진현정", "1112": "윤규빈", "1113": "최나예", "1114": "김현수", "1115": "김예준", "1116": "김윤재", "1117": "민동원", "1118": "민지홍", "1119": "박채성", "1120": "박태환", "1121": "이민재", "1122": "이찬서", "1123": "이태연", "1124": "정지욱", "1125": "정하준", "1126": "한준혁", "1127": "홍승표", "1201": "김수아", "1202": "김라원", "1203": "박미진", "1204": "박은진", "1205": "백지우", "1206": "윤서빈", "1207": "윤지아", "1208": "이하율", "1209": "이하은", "1210": "최예슬", "1211": "하다희", "1212": "허지윤", "1213": "강서흔", "1214": "김도흔", "1215": "김태경", "1216": "김태균", "1217": "김태연", "1218": "박여민", "1219": "박준우", "1220": "엄지우", "1221": "오재윤", "1222": "윤현준", "1223": "이민우", "1224": "장유비", "1225": "전재영", "1226": "최연우", "1301": "김다인", "1302": "김승아", "1303": "김윤서", "1304": "김해미", "1305": "김희주", "1306": "박결", "1307": "박나린", "1308": "박서윤", "1309": "박수빈", "1310": "박유정", "1311": "신초은", "1312": "임수영", "1313": "정하윤", "1314": "김건희", "1315": "김동욱", "1316": "김무궁", "1317": "김세훈", "1318": "박예준", "1319": "박제이", "1320": "송하준", "1321": "안시우", "1322": "유서준", "1323": "윤태균", "1324": "이정우", "1325": "이태연", "1326": "정찬영", "1327": "민승기", "1401": "나세나", "1402": "민서연", "1403": "오윤서", "1404": "위지효", "1405": "유윤영", "1406": "이가현", "1407": "임수라", "1408": "임하율", "1409": "장윤위", "1410": "장혜율", "1411": "천지윤", "1412": "최소율", "1413": "최정은", "1414": "김가온", "1415": "김승민", "1416": "김영중", "1417": "김태현", "1418": "나윤준", "1419": "박규영", "1420": "박시우", "1421": "박지호", "1422": "신무준", "1423": "윤찬진", "1424": "이준서", "1425": "정석원", "1426": "한지한", "1427": "정성희", "1501": "강민영", "1502": "김단비", "1503": "김미솔", "1504": "김수연", "1505": "김은서", "1506": "박신해", "1507": "박채연", "1508": "박혜빈", "1509": "윤예서", "1510": "이지후", "1511": "임가온", "1512": "임수아", "1513": "전혜원", "1514": "강성원", "1515": "김민재", "1516": "김성윤", "1517": "김장현", "1518": "김현준", "1519": "박연성", "1520": "박용우", "1521": "박태윤", "1522": "신준범", "1523": "이기쁨", "1524": "이승혁", "1525": "전세인", "1526": "허진호"
        };

        let currentUser = { id: "", name: "" };
        let currentMode = "";
        let level = 1;      // 1 ~ 10단계
        let stage = 1;      // 1 ~ 3스테이지
        let lives = 3;
        let timeLeft = 15;
        let timerInterval = null;
        let currentProblem = {};

        // 최대공약수 (약분 판별용)
        function gcd(a, b) {
            return b === 0 ? Math.abs(a) : gcd(b, a % b);
        }

        // 1. 학번 인증
        function checkAuth() {
            const idInput = document.getElementById("student-id").value.trim();
            const alertEl = document.getElementById("auth-alert");

            if (studentList[idInput]) {
                currentUser.id = idInput;
                currentUser.name = studentList[idInput];
                alertEl.innerText = "";
                
                document.getElementById("screen-auth").classList.add("hidden");
                document.getElementById("screen-mode").classList.remove("hidden");
                document.getElementById("welcome-msg").innerText = `${currentUser.id} ${currentUser.name}님 환영합니다!`;
            } else {
                alertEl.innerText = "등록되지 않은 학번입니다. 학번을 확인해주세요.";
            }
        }

        // 2. 게임 시작
        function startGame(mode) {
            currentMode = mode;
            level = 1; stage = 1; lives = 3;
            document.getElementById("screen-mode").classList.add("hidden");
            document.getElementById("screen-game").classList.remove("hidden");
            document.getElementById("user-info").innerText = `${currentUser.id} ${currentUser.name}`;
            
            nextQuestion();
        }

        // 3. 난수 생성 및 문제 출제
        function generateProblem() {
            const range = level * 5; // 분모/분자 범위 (단계 x 5)
            let op = currentMode;
            if (op === '랜덤') {
                const ops = ['덧셈', '뺄셈', '곱셈', '나눗셈'];
                op = ops[Math.floor(Math.random() * ops.length)];
            }

            // 분수 생성 함수
            function getRandomFrac() {
                let den = Math.floor(Math.random() * range) + 1;
                let num = Math.floor(Math.random() * range) + 1;
                return { num, den };
            }

            let f1 = getRandomFrac();
            let f2 = getRandomFrac();

            // 2단계부터 정수 등장 가능 (확률 30%)
            let isInt1 = (level >= 2 && Math.random() < 0.3);
            let isInt2 = (level >= 2 && Math.random() < 0.3);
            if (isInt1) f1 = { num: Math.floor(Math.random() * level) + 1, den: 1 };
            if (isInt2) f2 = { num: Math.floor(Math.random() * level) + 1, den: 1 };

            // 뺄셈 시 음수 방지 (f1 > f2 유지)
            if (op === '뺄셈') {
                if ((f1.num / f1.den) < (f2.num / f2.den)) {
                    let temp = f1; f1 = f2; f2 = temp;
                }
            }

            // 정답 정밀 계산 (분수 연산)
            let resNum, resDen;
            if (op === '덧셈') {
                resNum = f1.num * f2.den + f2.num * f1.den;
                resDen = f1.den * f2.den;
            } else if (op === '뺄셈') {
                resNum = f1.num * f2.den - f2.num * f1.den;
                resDen = f1.den * f2.den;
            } else if (op === '곱셈') {
                resNum = f1.num * f2.num;
                resDen = f1.den * f2.den;
            } else if (op === '나눗셈') {
                resNum = f1.num * f2.den;
                resDen = f1.den * f2.num;
            }

            let g = gcd(resNum, resDen);
            let targetNum = resNum / g;
            let targetDen = resDen / g;

            return { f1, f2, op, targetNum, targetDen };
        }

        // 수식 HTML 생성기
        function renderFracHTML(f) {
            if (f.den === 1) return `<span>${f.num}</span>`; // 정수인 경우
            return `<div class="fraction"><span class="num">${f.num}</span><span class="den">${f.den}</span></div>`;
        }

        // 4. 다음 문제 진행
        function nextQuestion() {
            if (lives <= 0) return;
            
            document.getElementById("ans-num").value = "";
            document.getElementById("ans-den").value = "";
            document.getElementById("game-alert").innerText = "";
            
            // 상태 업데이트
            document.getElementById("stage-info").innerText = `${level}단계 (${stage}/3)`;
            document.getElementById("lives-display").innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);

            currentProblem = generateProblem();

            // 수식 화면에 출력
            let opSymbol = { '덧셈': '+', '뺄셈': '-', '곱셈': '×', '나눗셈': '÷' }[currentProblem.op];
            document.getElementById("equation-display").innerHTML = `
                ${renderFracHTML(currentProblem.f1)}
                <span>${opSymbol}</span>
                ${renderFracHTML(currentProblem.f2)}
                <span>=</span>
            `;

            startTimer();
        }

        // 5. 타이머 동작
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 15;
            updateTimerBar();

            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                updateTimerBar();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleFail("⏰ 시간이 초과되었습니다!");
                }
            }, 100);
        }

        function updateTimerBar() {
            const bar = document.getElementById("timer-bar");
            const percentage = (timeLeft / 15) * 100;
            bar.style.width = `${Math.max(0, percentage)}%`;
            bar.style.backgroundColor = percentage < 30 ? "#ef4444" : "#2563eb";
        }

        // 6. 정답 제출 검사
        function submitAnswer() {
            const userNum = parseInt(document.getElementById("ans-num").value);
            const userDen = parseInt(document.getElementById("ans-den").value);
            const alertEl = document.getElementById("game-alert");

            if (isNaN(userNum) || isNaN(userDen)) {
                alertEl.innerText = "분자와 분모를 모두 입력해주세요!";
                return;
            }
            if (userDen === 0) {
                alertEl.innerText = "분모는 0이 될 수 없습니다!";
                return;
            }

            // 약분 여부 체크 (최대공약수가 1이 아니면 약분 안 됨)
            if (gcd(userNum, userDen) !== 1) {
                alertEl.innerText = "⚠️ 약분하지 않았습니다! 기약분수로 입력해 주세요.";
                return;
            }

            clearInterval(timerInterval);

            // 정답 검사
            if (userNum === currentProblem.targetNum && userDen === currentProblem.targetDen) {
                // 정답!
                stage++;
                if (stage > 3) {
                    stage = 1;
                    level++;
                }

                if (level > 10) {
                    // 10단계 클리어 엔딩!
                    document.getElementById("screen-game").classList.add("hidden");
                    document.getElementById("screen-ending").classList.remove("hidden");
                    document.getElementById("ending-msg").innerText = 
                        `축하합니다! ${currentUser.id} ${currentUser.name}님은 분수 [${currentMode}] 계산의 끝에 도달하였습니다! 🎉`;
                } else {
                    nextQuestion();
                }
            } else {
                handleFail("❌ 오답입니다!");
            }
        }

        // 7. 실패(오답/시간초과) 처리
        function handleFail(reason) {
            lives--;
            document.getElementById("lives-display").innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);

            document.getElementById("modal-title").innerText = reason;
            document.getElementById("modal-msg").innerText = "정답은 다음과 같습니다:";
            
            // 정답 수식 모달에 출력
            let ansHTML = renderFracHTML({ num: currentProblem.targetNum, den: currentProblem.targetDen });
            document.getElementById("modal-answer-box").innerHTML = ansHTML;

            document.getElementById("modal-explain").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("modal-explain").classList.add("hidden");
            if (lives <= 0) {
                alert("목숨을 모두 소진하였습니다. 게임을 다시 시작합니다.");
                location.reload();
            } else {
                nextQuestion();
            }
        }
    </script>
</body>
</html>
