<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 실험실</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f8fafc; color: #334155; line-height: 1.6; }
        
        /* 네비게이션 바 */
        nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav .logo { font-size: 1.25rem; font-weight: bold; color: #2563eb; }
        
        /* 메인 히어로 섹션 */
        header { text-align: center; padding: 4rem 1rem 3rem; background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); }
        header h1 { font-size: 2.25rem; color: #1e3a8a; margin-bottom: 1rem; }
        header p { font-size: 1.1rem; color: #475569; max-width: 600px; margin: 0 auto; }
        
        /* 프로그램 그리드 레이아웃 */
        section { max-width: 1000px; margin: 3rem auto; padding: 0 1rem; }
        section h2 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #1e293b; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .card .icon { font-size: 2rem; margin-bottom: 0.75rem; }
        .card h3 { font-size: 1.2rem; color: #0f172a; margin-bottom: 0.5rem; }
        .card p { font-size: 0.95rem; color: #64748b; margin-bottom: 1.25rem; }
        .card a { display: inline-block; background: #2563eb; color: #ffffff; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 500; font-size: 0.9rem; }
        .card a:hover { background: #1d4ed8; }
        
        /* 푸터 */
        footer { text-align: center; padding: 2rem; border-top: 1px solid #e2e8f0; color: #94a3b8; font-size: 0.9rem; margin-top: 4rem; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🧪 나만의 수학 실험실</div>
    </nav>

    <header>
        <h1>즐겁게 탐구하는 수학 실험실 📐</h1>
        <p>직접 손으로 만지고 조작하며 원리를 이해하는 수학 학습 아카이브입니다.</p>
    </header>

    <section>
        <h2>학습 프로그램</h2>
        <div class="grid">
            
            <!-- 첫 번째 카드 예시 -->
            <div class="card">
                <div class="icon">🎯</div>
                <h3>좌표평면 연습하기</h3>
                <p>좌표평면 위에서 x, y 좌표를 맞혀보는 첫 번째 미니게임입니다.</p>
                <a href="game.html">실험 시작하기 →</a>
            </div>

            <!-- 두 번째 카드 예시 -->
            <div class="card">
                <div class="icon">🌿</div>
                <h3>소수 탐구실</h3>
                <p>에라토스테네스의 체 원리로 소수를 찾아보는 시뮬레이션입니다.</p>
                <a href="#">실험 시작하기 →</a>
            </div>

        </div>
    </section>

    <footer>
        <p>© 2026 나만의 수학 실험실. All rights reserved.</p>
    </footer>

</body>
</html>
